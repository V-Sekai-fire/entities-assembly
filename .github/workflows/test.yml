# The format workflow explains what is deliberately not built here: the driver
# pushes tags to a real remote, so CI does not run it. `mix test` is another
# matter -- its fixtures are throwaway repositories in a temp directory -- and it
# shells out to the runner's system git on both platforms.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Dependencies
        run: mix deps.get

      - name: The assembler's own tests
        run: mix test

      # Proves the driver parses and runs on this platform without touching a remote.
      - name: The driver starts
        run: elixir update_godot_v_sekai.exs --help
